[[contract]]
name = "HarnessAcpAgentTurn"
title = "ACP user and agent turns: one ending, idle work opens a turn, policy answers permissions, quiet or a queued prompt closes only without open work."
models = ["HarnessAcpAgentTurn", "BrokenHarnessAcpAgentTurn", "BrokenHarnessAcpAgentGrace", "BrokenHarnessAcpAgentIdleCancel"]
controls = [{name="BrokenHarnessAcpAgentTurn",expected="safety"},{name="BrokenHarnessAcpAgentGrace",expected="safety"},{name="BrokenHarnessAcpAgentIdleCancel",expected="safety"}]
sources = ["src/backend/acp_agent.rs", "src/backend/acp_permissions.rs", "src/provider/profile.rs", "src/onboarding.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/acp_agent.rs", "tests/ir_edge.rs", "tests/harness_onboarding.rs", "src/backend/acp_permissions.rs"]
assumptions = "Full-access defaults, vendor argv/environment, advertised-mode/config parsing and allow_once/allow_always preference are implementation-only witnesses; the existing finite lifecycle/policy actions are unchanged. One user prompt or agent-origin turn in flight, at most one permission and one tool per turn, two finite wire updates, origin 0..2. Idle work or permission atomically opens an agent turn; idle session gauges do not. Quiet is an abstract timer reset by wire receipt; a queued user prompt bypasses only the timer, never open tools or permissions. Weak fairness on permission answering, tool completion, quiet timer, quiet completion and TurnEnded guarantees agent-turn progress after a finite burst. Actual 30s/default and 200ms/test silence durations, rearming and queue latency are process witnesses in tests/acp_agent.rs. At most one permission request per prompt, a face answer only while awaited, the agent ends its prompt only when not awaiting an answer (it blocks on request_permission), turn end settles open permissions. An agent may ignore cancel permanently; weak fairness on the union of agent completion and grace expiry, and on TurnEnded, guarantees cancellation progress without agent cooperation. Grace expiry kills the agent before ending. Two finite active-turn updates use received/retained counters 0..2; local persistence is weak-fair and a correct ending waits for equality. Metadata outside a turn, exact ext values and redaction remain process witnesses. Real deadlines (including BBOXY450_ACP_CANCEL_GRACE_MS), process-group signals/reaping, child crashes, malformed lines and -32601 replies are implementation witnesses in tests/acp_agent.rs."
property = "NoWorkItemOutsideTurn, PermissionCancelledOnlyAfterCancel, QuietEndsOnlyWithoutOpenWork and AgentTurnEventuallyEnds; a freshly ended turn is the only ending of its prompt; a cancel answers every pending permission cancelled; a cancelled turn ends. Two finite update receipts are retained as typed ext or Native before ending; NoUpdateLossAtTurnEnd."
