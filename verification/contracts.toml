sources = ["src/capability.rs", "src/redact.rs", "src/frontends/headless.rs", "src/frontends/gui/bridge.rs", "src/mcp.rs", "src/tools.rs", "src/engine/mod.rs", "src/engine/turn_loop.rs", "tests/formal/models.rs"]
