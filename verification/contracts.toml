[[contract]]
name = "HarnessSteerQueue"
title = "Interrupt admitted when work full; a steer is consumed exactly once under weak fairness."
models = ["HarnessSteerQueue", "BrokenHarnessSteerQueue", "BrokenHarnessSteerQueueDelivery"]
controls = [{name="BrokenHarnessSteerQueue", expected="liveness"}, {name="BrokenHarnessSteerQueueDelivery", expected="safety"}]
sources = ["src/gateway/mod.rs", "src/engine/mod.rs", "src/engine/turn_loop.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/gateway_ops.rs", "tests/e2e_scripted.rs", "tests/formal_nonvacuity.rs"]
assumptions = "One acked steer, one running/ended turn, one independent interrupt and a full 64-slot work lane. Weak fairness on delivery/conversion and control admission/consumption. Multi-steer FIFO order is an implementation witness in e2e_scripted; the separate ControlLaneBound model explores depths 0..257. No arbitrary Rust refinement proof."
property = "Interrupt admitted when work full; a steer is consumed exactly once under weak fairness."
checks = ["make test-formal", "make test"]

