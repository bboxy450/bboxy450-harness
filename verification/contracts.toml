[[contract]]
name="HarnessControlLaneBound"
title="A full work lane does not reduce the independent 256-slot control capacity"
models=["HarnessControlLaneBound","BrokenHarnessControlLaneBound"]
sources=["src/engine/mod.rs","src/gateway/mod.rs","tests/formal/models.rs"]
implementation_tests=["tests/gateway_ops.rs","tests/formal_nonvacuity.rs"]
assumptions="Full 64-slot work lane; producer/consumer populations of 65 interrupt slots, 64 approval slots and one Close slot. Correct producers own and consumers return their type slot. The broken producer loses its reservation at full legitimate population and floods duplicates to depth 257 while consumers are delayed for this finite safety witness. FIFO and arbitrary malicious traffic remain implementation witnesses; no fairness claim."
property="Per-type slots are conserved, depth equals the outstanding op count, and the dynamically reachable legitimate maximum 130 fits the independent 256 capacity. The duplicate producer breaks slot conservation and overflows capacity."
checks=["make test-formal","make test"]

[[contract]]
name="HarnessSeatShutdown"
title="Shutdown watch observes PTY EOF independently of stdout and catches an in-flight fork"
models=["HarnessSeatShutdown","BrokenHarnessSeatShutdownSingleKill","BrokenHarnessSeatShutdownBlockedOutput"]
controls=[{name="BrokenHarnessSeatShutdownSingleKill",expected="safety"},{name="BrokenHarnessSeatShutdownBlockedOutput",expected="safety"}]
sources=["src/frontends/headless.rs","src/process.rs","tests/formal/models.rs"]
implementation_tests=["tests/seat_process.rs","tests/support/seat_shutdown.rs","tests/formal_nonvacuity.rs"]
assumptions="One owned leader and member, each alive/signalled/exited/reaped; at most one fork is in progress when shutdown starts. A killpg signals currently published members, not a child still being forked. That fork settles before a second watch opportunity, and signalled processes exit before supervisor escalation. These are explicit finite scheduling/OS bounds, not consequences of weak fairness or proofs of arbitrary fork trees. Physical EOF may deliver no signal and stdout may remain blocked throughout. Terminal read/write/flush errors are teardown observations without re-sampling HUP. The watch runs independently of face output; process witnesses retain the real 250ms escalation and 2s ESRCH deadline. Registry ownership and PID reuse remain HarnessProcessLifecycle. The model separates signalling, exit and reap; kernel wait/reparenting and the measured 5ms polling schedule remain implementation-only coverage."
property="Physical EOF and terminal I/O errors are observed even with blocked output; a member published after the first kill is signalled by the next watch. After bounded OS exit and supervisor escalation neither leader nor member is executable. Exited processes are eventually reaped under weak fairness of reap; shutdown progresses under weak fairness of the watch/fork/exit/escalation actions within the explicit bounded schedule."
checks=["make test-formal","make test"]

[[contract]]
name="HarnessProcessLifecycle"
title="Cancel kills remaining members before releasing the leader reservation"
models=["HarnessProcessLifecycle","BrokenHarnessProcessDrain","BrokenHarnessProcessOwnership","BrokenHarnessProcessReapedMembers","BrokenHarnessProcessHangup","BrokenHarnessProcessReapLease"]
controls=[{name="BrokenHarnessProcessDrain",expected="liveness"},{name="BrokenHarnessProcessOwnership",expected="safety"},{name="BrokenHarnessProcessReapedMembers",expected="safety"},{name="BrokenHarnessProcessHangup",expected="safety"},{name="BrokenHarnessProcessReapLease",expected="safety"}]
sources=["src/process.rs","src/mcp.rs","src/frontends/headless.rs","tests/formal/models.rs"]
implementation_tests=["src/process.rs","tests/cancel_process.rs","tests/mcp_client.rs","tests/seat_process.rs","tests/support/seat_shutdown.rs","tests/formal_nonvacuity.rs"]
assumptions="OwnedChild exclusively owns the waitable leader; SDKs/readers receive only pipes. SIGCHLD auto-reaping is rejected at spawn; foreign unsafe waitpid/disposition changes violate the ownership precondition and are outside this model. The only correct reap action retires registration before releasing identity. A signal action reads registration; the stale-registration control reaches a foreign signal after reap, rather than merely failing an assignment invariant. One arbitrary owned group stands for any tool, terminal or MCP group. The seat can receive hangup, then be killed by its supervisor before async cleanup. Hangup abstracts signalling the currently published group before notifying async close; broken Hangup omits that kill. HarnessSeatShutdown separately covers a fork publishing after that first signal and EOF observation while stdout is blocked. The 100ms/250ms OS deadlines and signal-handler instruction bounds are process/structural witnesses, not modeled real time. One leader (running/exited-waitable/reaped), one independent live member and one possibly escaped pipe holder. Leader exit, member exit, signal, reap, drain and cancel completion are separate actions. Weak fairness on exit/signal/reap/drain/end; OS waitid, real PID reuse and the 500ms grace remain process witnesses."
property="Cancel completion implies no live member. A signal never targets a group with neither a leader reservation nor a member; bounded drain eventually ends cancellation while the seat lives. After release a retained registration must not enable a signal to the now-foreign group (NoSignalToEmptyGroup); the unit witness also checks retirement. After supervisor KILL no group member is alive. Abrupt seat death discharges the local join obligation; durable recovery is witnessed separately."
checks=["make test-formal","make test"]

