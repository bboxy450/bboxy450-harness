[[contract]]
name = "HarnessNativeUsage"
title = "Native usage counts each identified model call once across turn boundaries."
models = ["HarnessNativeUsage", "BrokenHarnessNativeUsage", "BrokenHarnessNativeUsageScopes"]
controls = [{name="BrokenHarnessNativeUsage", expected="safety"}, {name="BrokenHarnessNativeUsageScopes", expected="safety"}]
sources = ["src/import/mod.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/import_native.rs"]
assumptions = "Two identified calls carrying one and two abstract tokens, arbitrarily repeated before/after two endings, plus three independent cumulative session snapshots (1-3-1); identities persist and only turn totals reset. Weak fairness of local EndTurn only; no fairness of native IO. Field parsing, cache tiers, model changes, cumulative snapshots/resets and integer overflow are implementation-only; no Rust refinement proof."
property = "Exactly one usage item per known call; each turn's sum plus finished totals equals reported unique calls, without adding cumulative session snapshots."
checks = ["make test-formal", "make test"]

