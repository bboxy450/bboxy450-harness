[[contract]]
name = "HarnessTurnLifecycle"
title = "Exactly one ending; paired results at end; replay never redispatches; every queued turn eventually ends under weak fairness."
models = ["HarnessTurnLifecycle", "BrokenHarnessTurnLifecycle"]
sources = ["src/engine/turn_loop.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/e2e_scripted.rs"]
assumptions = "Finite integer/Boolean model; two turns and tools, three births/log entries, bounded queues; named weak-fair action groups only. Replay drain abstracts a finite prefix atomically. Real HTTP, filesystem atomicity, kernel scheduling, monotonic time and terminal bytes remain implementation-only. No refinement proof."
property = "Exactly one ending; paired results at end; replay never redispatches; every queued turn eventually ends under weak fairness."
checks = ["make test-formal", "make test"]

