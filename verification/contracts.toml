[[contract]]
name = "HarnessMcpServer"
title = "An unavailable server never holds admission; requests timeout or finish, results are fenced by birth, and a supplied capability is registered before output projection."
models = ["HarnessMcpServer", "BrokenHarnessMcpServerA", "BrokenHarnessMcpServerB", "BrokenHarnessMcpServerC", "BrokenHarnessMcpServerD", "BrokenHarnessMcpServerE"]
controls = [{name="BrokenHarnessMcpServerA", expected="deadlock"}, {name="BrokenHarnessMcpServerB", expected="safety"}, {name="BrokenHarnessMcpServerC", expected="liveness"}, {name="BrokenHarnessMcpServerD", expected="safety"}, {name="BrokenHarnessMcpServerE", expected="safety"}]
sources = ["src/capability.rs", "src/redact.rs", "src/frontends/headless.rs", "src/frontends/gui/bridge.rs", "src/mcp.rs", "src/tools.rs", "src/engine/mod.rs", "src/engine/turn_loop.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/capability_delivery.rs", "tests/support/seat_launch.rs", "tests/mcp_client.rs", "tests/formal_nonvacuity.rs"]
assumptions = "Three births (gen 0..2, public A-B-A) abstract the five-attempt product limit. A held response can cross two failures; a silent call needs Timeout. Failure and restart are independent of round admission. Weak fairness on admission, immediate failure/call and response/discard/timeout groups. A valid-file input is registered during face preparation; an invalid supplied file completes preparation with a Notice, while an unset file completes silently. Output may follow either preparation, and MCP readiness follows preparation. Control D consults only the missing legacy variable despite a valid file; control E emits a Notice for the unset input. Actual IO checks, environment bytes, SDK framing, process groups, string matching, deadlines and pagination remain implementation witnesses; no arbitrary Rust refinement proof."
property = "NoStaleResult, DeadIsFinal, NoUnredactedCapability, QuietWhenUnset, ReadyAfterCapabilityAttempt; RoundNeverWaits and CallEventuallyEnds under the named fairness assumptions."
checks = ["make test-formal", "make test"]

[[contract]]
name = "HarnessAcpFlow"
title = "Session admission is FIFO, and a paused writer cannot close the face or hold the engine."
models = ["HarnessAcpFlow", "BrokenHarnessAcpFlowA", "BrokenHarnessAcpFlowB", "BrokenHarnessAcpFlowC"]
controls = [{name="BrokenHarnessAcpFlowA",expected="safety"},{name="BrokenHarnessAcpFlowB",expected="safety"},{name="BrokenHarnessAcpFlowC",expected="safety"}]
sources = ["src/frontends/acp.rs", "src/engine/task_group.rs", "src/gateway/mod.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/acp_face.rs", "tests/formal_nonvacuity.rs"]
assumptions = "One prompt followed by cancel; two engine events and two connection replies, queue 0..2 abstracts capacity 256. EngineNeverWaits is enabledness of the actual EngineEmit guard, including writer capacity in broken C; its witness compares actual successor edges at full capacity. Reading resumes under weak fairness, with a drain opportunity in every nonempty readable interval. Fair admission, engine, projection and writer actions; finite inbound burst. Durable prompt admission abstracts lag recovery; actual 4096-slot overflow and held-EOF replay are unit witnesses in src/frontends/acp.rs. Wire bytes, actual OS scheduling, dropped-delta repair and multi-session dispatch remain API witnesses. Pairing remains HarnessTurnLifecycle; no Rust refinement claim."
property = "CancelHitsItsPrompt, CloseOnlyOnEof, EngineNeverWaits and PromptEventuallyResponds."
checks = ["make test-formal", "make test"]

[[contract]]
name = "HarnessMcpGroupClose"
title = "Close joins every member of its process group even when SIGTERM is ignored."
models = ["HarnessMcpGroupClose", "BrokenHarnessMcpGroupClose", "BrokenHarnessMcpLostChild"]
controls = [{name="BrokenHarnessMcpGroupClose",expected="safety"},{name="BrokenHarnessMcpLostChild",expected="safety"}]
sources = ["src/mcp.rs", "tests/formal/models.rs"]
implementation_tests = ["tests/mcp_client.rs", "tests/bin/mcp_fixture.rs", "tests/formal_nonvacuity.rs"]
assumptions = "A close notification is delivered or its sender is lost; either outcome must clean up. A missing child id can exist before finish only after a fenced wait killed members and retired registration. One unreaped leader and zero to two members; SIGTERM is ignored. Grace expiry abstracts the timer and sends SIGKILL, then leader wait completes Close. WNOWAIT exit observation and skipping or polling the one-second grace are structural implementation witnesses, with no wall-clock percentile claim. Members may exit independently before completion. Weak fairness on kill/reap after Close begins. Group ownership and pgid reuse remain HarnessProcessLifecycle; OS signals, EOF and reaping are process witnesses, not arbitrary Rust refinement. Maps to src/mcp.rs::finish_child and the stubborn_group fixture."
property = "NoMemberAfterClose, ReapAfterKill and NoRegistrationAfterReap; CloseEventuallyCompletes. Broken control kills only the leader, leaving a live member at completed Close."
checks = ["make test-formal", "make test"]

