[[contract]]
name="HarnessProfileLoad"
title="Closing a session joins pending profile IO without a late profile effect"
models=["HarnessProfileLoad","BrokenHarnessProfileLoad"]
sources=["src/engine/mod.rs","src/gateway/host.rs","src/provider/profile.rs","tests/formal/models.rs"]
implementation_tests=["tests/profile_lifecycle.rs","tests/gateway_host.rs"]
assumptions="One profile operation, three births, one held completion. Named weak fairness on joining/retiring. Filesystem scheduling and kernel process-group timing remain implementation witnesses."
property="A stale or closed profile slot never changes session configuration; Close eventually joins it."
checks=["make test-formal","make test"]

[[contract]]
name="HarnessForkMaterialize"
title="Publish a complete fixed parent prefix and its blobs atomically"
models=["HarnessForkMaterialize","BrokenHarnessForkMaterialize"]
sources=["src/store.rs","src/store/fork.rs","tests/formal/models.rs"]
implementation_tests=["tests/store_fork.rs"]
assumptions="One fixed fork point, two parent heads, four materialization phases; crash may repeat forever, so no liveness claim. Actual rename, fsync, blob hashes, credentials and filesystem scheduling are implementation-only witnesses."
property="Visible child implies its blobs and fixed parent prefix are complete, regardless of subsequent parent appends."
checks=["make test-formal","make test"]

[[contract]]
name="HarnessControlLaneBound"
title="A full work lane does not reduce the independent 256-slot control capacity"
models=["HarnessControlLaneBound","BrokenHarnessControlLaneBound"]
sources=["src/engine/mod.rs","src/gateway/mod.rs","tests/formal/models.rs"]
implementation_tests=["tests/gateway_ops.rs","tests/formal_nonvacuity.rs"]
assumptions="One fixed full 64-slot work lane, control depths 0..257, legitimate outstanding controls at most 65+64+1=130. Flood beyond capacity is refused; scheduling is not modeled."
property="Control admission saturates at 256 and the legitimate bound fits independently of work."
checks=["make test-formal","make test"]

[[contract]]
name="HarnessProcessLifecycle"
title="Cancellation closes escaped pipes and a reaped group cannot be signalled"
models=["HarnessProcessLifecycle","BrokenHarnessProcessDrain","BrokenHarnessProcessOwnership"]
controls=[{name="BrokenHarnessProcessDrain",expected="liveness"},{name="BrokenHarnessProcessOwnership",expected="safety"}]
sources=["src/process.rs","tests/formal/models.rs"]
implementation_tests=["tests/cancel_process.rs"]
assumptions="One owned leader, one escaped pipe holder, four cancellation phases. Weak fairness on kill/drain/end models eventual progress; the physical 500ms grace and 2s bound are real-process witnesses."
property="A cancelled run eventually ends after bounded drain; reaped ownership never signals a reused group."
checks=["make test-formal","make test"]

[[contract]]
name="HarnessSubscriberReplayRegistration"
title="Registration precedes the replay snapshot"
models=["HarnessSubscriberReplayRegistration","BrokenHarnessSubscriberReplayRegistration"]
sources=["src/gateway/mod.rs","tests/formal/models.rs"]
implementation_tests=["tests/gateway_replay.rs","tests/gateway_lag.rs"]
assumptions="Three durable entries, one concurrent append, atomic registration and snapshot actions; kernel scheduling and actual socket delivery remain implementation witnesses."
property="No durable entry can fall between the replay snapshot and live registration."
checks=["make test-formal","make test"]
