assumptions = "Three births (gen 0..2, public A-B-A) abstract the five-attempt product limit. A held response can cross two failures; a silent call needs Timeout. Failure and restart are independent of round admission. Weak fairness on admission, immediate failure/call and response/discard/timeout groups. A valid-file input is registered during face preparation; an invalid supplied file completes preparation with a Notice, while an unset file completes silently. Output may follow either preparation, and MCP readiness follows preparation. Control D consults only the missing legacy variable despite a valid file; control E emits a Notice for the unset input. Actual IO checks, environment bytes, SDK framing, process groups, string matching, deadlines and pagination remain implementation witnesses; no arbitrary Rust refinement proof."
property = "NoStaleResult, DeadIsFinal, NoUnredactedCapability, QuietWhenUnset, ReadyAfterCapabilityAttempt; RoundNeverWaits and CallEventuallyEnds under the named fairness assumptions."
