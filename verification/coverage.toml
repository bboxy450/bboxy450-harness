implementation_only = [
    "One existing private controller/result path, not a new wire schema or controller. Three immutable repeated-control counts0..2, three actual persistence outcomes (persisted, not persisted, unknown), three terminal-cost outcomes (within ordinary unit, known overrun, raw unknown), finite observation phases and a pre-final-receipt tail cutoff bound this projection. Distinct verdict axes and bounded error counts survive an earlier refusal; the first-error compatibility field never substitutes for the complete ledger. Known representative tail bounds1/2 create full fresh9/18 debt; raw unknown retains conservative3/27 obligation and cannot claim payment. This is a finite per-axis/count abstraction of fixed-capacity per-code counters, explicit overflow/unknown bucket and bounded detail samples, not a proof of arbitrary error multiplicity or C arithmetic. Final audit is attempted only after output-close and every exit-tail observation is retained at an explicit pre-final-receipt cutoff; known tail cost is fully paid and raw unknown remains explicitly unpaid. The final audit write itself, durability, stdout completeness, actual open/write/fsync/close/directory-fsync, clocks, kernel lifetime, retained raw bytes and process exit remain implementation witnesses; no self-write durability or whole-command lifetime theorem is claimed. No ownership release, qualification or runtime approval action exists here. Only enabled local known-debt payment and final audit-attempt bookkeeping are weakly fair; no IO, clock or kernel progress fairness. Source mappings are canonical proof-helper-probe.c private_fail/private_emit/private_candidate and its bounded error ledger/final raw audit. Actual source-known EEXIST persistence failure with earlier control refusal, actual over1ms tail CPU with successful persistence, and first-error-only/false-persistence/early-final controls are private-engine-controls.c and check-private-engine-controls.py obligations; their current source-bound exits must be independently checked and are not inferred by the model. Existing MemberWindow still requires original unsplit W, max(W,A)+all active controller/pipe/late cost <=1ms and fresh9x debt. An8.381ms unclosed positive window remains a refused overrun; late-STOP and over-controller-CPU causal controls must preserve it, never backdate/split that W or add a native class.",
    "This separate finite creation-admission projection refines the initial creation gap that the aggregate Helper and MemberWindow models do not distinguish. Raw0 is unobserved, raw1 exact quiescence, raw2 only SSTOP4/one thread/one running kernel tail, raw3 any invalid tuple. Two independent first/second observations, two generations0/1 (one bounded full resample after pending), eight immutable lifecycle profiles (initial, settled, ready, running, grant-open, user-growth, expired original deadline, unknown final native cost), original owner/pin, acknowledgement/CONT, finite known-cost/full-debt flags bound the graph. Only the initial zero-user context can hold raw2 pending; the wrong-phase profiles test misuse of INITIAL authority, not the complete runtime STOP sampler modeled by MemberWindow. A pending first or second observation is never an ACK and requires a new FIRST and SECOND valid pair in the same fresh generation. Deadline expiry refuses without extension/replacement, keeping the original attempt, effect and pin. A complete physical pair may acknowledge quiescence before final native classification; CONT additionally needs known within-budget cost and full fresh paid creation debt. Only enabled local debt payment/CONT bookkeeping is weakly fair. OS query completion/success, child progress, scheduling, clocks and deadline observation have no fairness guarantee; an unresolved bounded-query projection can remain owned/refused, never fabricate success. Numeric native2msCPU/25mswall, app1ms/raw-inclusive3ms, original25ms initial-admission observation budget/100us sleep, actual current token/path/RI identity, zero user CPU, raw Mach conversions, full original inclusive cost/debt and actual retirement/reap are implementation-only obligations. Source mappings are c1.rs HelperGroup::sample_inner/member_continuity_inner/initial_kernel_tail_pending and read.rs ProofClock::helper_attach plus resolve.rs original measured creation/retirement owner. The actual-child sour