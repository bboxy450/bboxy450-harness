# Config boundary. Clippy searches upward for clippy.toml; this file stops that
# search so a parent workspace's policy (bboxy450-term's UI policy, when this
# repository is its submodule) never applies here. The GUI gate keeps its own
# policy via CLIPPY_CONF_DIR=src/frontends/gui/lint (Makefile).
