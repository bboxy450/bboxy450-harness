[package]
name = "bboxy450-harness"
version = "0.2.0"
edition = "2024"
default-run = "bboxy450-harness"
rust-version = "1.99"
authors = ["Boxy <bboxy450@gmail.com>"]
description = "A GUI-first coding-agent harness with one replayable protocol"
repository = "https://github.com/bboxy450/bboxy450-harness"
license-file = "LICENSE"
exclude = [".bboxy/**", "target/**"]

[features]
# Every build serves ACP (`bboxy450-harness acp`): remote supervisors require it.
default = ["acp-agent", "acp"]
standalone = ["embedded", "dep:winit", "dep:wgpu", "dep:bbt_desktop"]
embedded = ["dep:bbt_doc", "dep:bbt_ui", "dep:bbt_ui_model", "dep:bbt_render", "dep:png", "dep:bbt_desktop_core"]
acp = ["dep:agent-client-protocol"]
# The harness as the UI for any ACP agent (src/backend/acp_agent.rs).
acp-agent = ["dep:agent-client-protocol"]
test-fixtures = []

[dependencies]
bbt_doc = { package = "bboxy450-doc", version = "=0.2.0", optional = true }
bbt_ui = { package = "bboxy450-ui", version = "=0.2.0", optional = true }
bbt_ui_model = { package = "bboxy450-ui-core", version = "=0.2.0", optional = true }
bbt_render = { package = "bboxy450-render", version = "=0.2.0", optional = true }
# The term's platform-free menu model and window actions (harness-spec.md Standalone window),
# and its AppKit menu bar, window and title-bar helpers.
bbt_desktop_core = { package = "bboxy450-term-desktop-core", version = "=0.2.0", optional = true }
bbt_desktop = { package = "bboxy450-term-desktop", version = "=0.2.0", optional = true }
winit = { version = "0.30", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"], optional = true }
png = { version = "0.18", optional = true }
bbt_rt = { package = "bboxy450-rt", version = "=0.2.0" }
bbt_yarn = { package = "bboxy450-yarn", version = "=0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
hashbrown = { version = "=0.17.1", default-features = false }
serde_yaml = "0.9"
zeroize = "1"
sha2 = "0.10"
# Reuse the locked NFC data and Ed25519 implementation; enable no new package graph.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
ring = "=0.17.14"
libc = "0.2"
glob = "0.3"
regex = "1"
httpdate = "1"
arc-swap = "1"
crossbeam-queue = "0.3"
im = "15"

agent-client-protocol = {version = "=3.4.0", default-features = false, features = ["stdio"], optional = true}
rmcp = {version = "=3.5.1", default-features = false, features = ["client", "server", "transport-child-process", "transport-io"]}
process-wrap = {version = "10", features = ["tokio1"]}
base64 = "0.22"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
bbt_yarn = { package = "bboxy450-yarn", version = "=0.2.0", features = ["model"] }
tempfile = "3"
bbt_tlc = { package = "bboxy450-tlc", version = "=0.2.0" }
portable-pty = "0.9"

[lib]
name = "bboxy450_harness"

[[bin]]
name = "bboxy450-harness"
path = "src/main.rs"

[[bin]]
name = "mcp-fixture"
path = "tests/bin/mcp_fixture.rs"
required-features = ["test-fixtures"]
