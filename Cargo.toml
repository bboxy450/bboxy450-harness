[package]
name = "bboxy450-harness"
version = "0.1.0"
edition = "2024"
default-run = "bboxy450-harness"
rust-version = "1.99"
authors = ["Boxy <bboxy450@gmail.com>"]
description = "A GUI-first coding-agent harness with one replayable protocol"
repository = "https://github.com/bboxy450/bboxy450-harness"
license-file = "LICENSE"

[features]
default = []
standalone = ["embedded", "dep:winit", "dep:wgpu"]
embedded = ["dep:bbt_doc", "dep:bbt_ui", "dep:bbt_ui_model", "dep:bbt_render", "dep:png"]
acp = ["dep:agent-client-protocol"]
test-fixtures = []

[dependencies]
bbt_doc = { package = "bboxy450-doc", version = "=0.1.1", optional = true }
bbt_ui = { package = "bboxy450-ui", version = "=0.1.1", optional = true }
bbt_ui_model = { package = "bboxy450-ui-core", version = "=0.1.1", optional = true }
bbt_render = { package = "bboxy450-render", version = "=0.1.1", optional = true }
winit = { version = "0.30", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"], optional = true }
png = { version = "0.18", optional = true }
bbt_rt = { package = "bboxy450-rt", version = "=0.1.1" }
bbt_yarn = { package = "bboxy450-yarn", version = "=0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_yaml = "0.9"
zeroize = "1"
sha2 = "0.10"
libc = "0.2"
glob = "0.3"
regex = "1"
httpdate = "1"
arc-swap = "1"
crossbeam-queue = "0.3"
im = "15"

agent-client-protocol = {version = "=3.4.0", default-features = false, features = ["stdio"], optional = true}
rmcp = {version = "=3.5.1", default-features = false, features = ["client", "server", "transport-child-process", "transport-io"]}
process-wrap = {version = "10", features = ["tokio1"]}
base64 = "0.22"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
bbt_yarn = { package = "bboxy450-yarn", version = "=0.1.1", features = ["model"] }
tempfile = "3"
bbt_tlc = { package = "bboxy450-tlc", version = "=0.1.1" }
portable-pty = "0.9"

[lib]
name = "bboxy450_harness"

[[bin]]
name = "bboxy450-harness"
path = "src/main.rs"

[[bin]]
name = "mcp-fixture"
path = "tests/bin/mcp_fixture.rs"
required-features = ["test-fixtures"]

[patch.crates-io]
bboxy450-ui = { git = "https://github.com/bboxy450/bboxy450-term", rev = "18ff123b6dc68d2a4f578417359c910a3ce933b3" }
bboxy450-doc = { git = "https://github.com/bboxy450/bboxy450-term", rev = "18ff123b6dc68d2a4f578417359c910a3ce933b3" }
bboxy450-render = { git = "https://github.com/bboxy450/bboxy450-term", rev = "18ff123b6dc68d2a4f578417359c910a3ce933b3" }

# Keep the published core dependencies shared with the git-pinned widgets (R15).
[patch."https://github.com/bboxy450/bboxy450-term"]
bboxy450-ui-core = { version = "=0.1.1" }
bboxy450-rt = { version = "=0.1.1" }
