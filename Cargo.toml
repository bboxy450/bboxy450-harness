[package]
name = "bboxy450-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Boxy <bboxy450@gmail.com>"]
description = "A GUI-first coding-agent harness with one replayable protocol"
repository = "https://github.com/bboxy450/bboxy450-harness"
license-file = "LICENSE"

[features]
default = []
standalone = []
embedded = []
acp = []

[dependencies]
bbt_rt = { package = "bboxy450-rt", version = "=0.1.1" }
bbt_yarn = { package = "bboxy450-yarn", version = "=0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_yaml = "0.9"
zeroize = "1"
sha2 = "0.10"
libc = "0.2"
glob = "0.3"
regex = "1"
httpdate = "1"
arc-swap = "1"
crossbeam-queue = "0.3"
im = "15"

[dev-dependencies]
bbt_yarn = { package = "bboxy450-yarn", version = "=0.1.1", features = ["model"] }
tempfile = "3"
bbt_tlc = { package = "bboxy450-tlc", version = "=0.1.1" }
portable-pty = "0.9"

[lib]
name = "bboxy450_harness"

[[bin]]
name = "bboxy450-harness"
path = "src/main.rs"
